[project]
name = "nightcrew"
version = "0.1.0"
description = "Spec-to-PR build agent where every PR is hard-blocked behind a verification gate"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.scripts]
nightcrew = "nightcrew.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightcrew"]

[dependency-groups]
dev = ["pytest>=8"]
