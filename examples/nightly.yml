# Zero-infra reference: nightly Nightcrew run via GitHub Actions.
# Copy into the repo that holds your fleet.json (and this checkout layout),
# set the secrets below, done. Runs at 02:00 UTC.
name: nightcrew-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # the nightcrew checkout
      - uses: actions/checkout@v4            # each enrolled repo, path = fleet.json "path"
        with:
          repository: you/my-repo
          path: my-repo
          token: ${{ secrets.GH_PAT }}       # push access for the PR branch
      - uses: astral-sh/setup-uv@v5
      - run: npm install -g @anthropic-ai/claude-code
      - run: uv sync
      - run: uv run nightcrew run --fleet fleet.json --log nightcrew.db
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - uses: actions/upload-artifact@v4     # keep the build log between runs
        if: always()
        with:
          name: nightcrew-db
          path: nightcrew.db
